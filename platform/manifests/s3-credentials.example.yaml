# Generic S3 credentials Secret for the lakehouse storage layer.
# Currently backed by SeaweedFS (see deploy/helm-values/seaweedfs.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: stardelt-s3-creds
  namespace: stardelt
type: Opaque
stringData:
  access-key: <YOUR_S3_ACCESS_KEY>
  secret-key: <YOUR_S3_SECRET_KEY>
  endpoint:   http://seaweedfs-s3.stardelt.svc.cluster.local:8333
  bucket:     lakehouse
  region:     us-east-1
# The SeaweedFS gateway reads its identities from a second Secret, seaweedfs-s3-config,
# key seaweedfs_s3_config (see docs/credentials.md). Create it with the same key pair.
#
# When the gateway is used for vended credentials (stardelt#201), the same key also carries
# "sts":{"signingKey":"<base64>"}, "policy":{"storeType":"memory","defaultEffect":"Deny"},
# a `policies` entry and a `roles` entry — see `scripts/s3-secrets.sh`'s `s3_config_json` for
# the exact document, and add `s3.extraArgs: ["-iam.config=/etc/sw/seaweedfs_s3_config"]`.
