# One config for the whole repository; each component's entries point into its folder.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
