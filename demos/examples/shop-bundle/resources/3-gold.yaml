name: shop-3-gold
description: "Builds the marts the demo reads: daily revenue, customer lifetime value and the product mix."
schedule: {cron: "0 3 * * *", timezone: Europe/Berlin}
viewers: [visitors]
params:
  schema: "${var.schema}"
notify: {onSuccess: [run-feed], onFailure: [run-feed]}
tasks:
  - {name: schema, sqlFile: sql/03_schema_gold.sql}
  - {name: daily_revenue, sqlFile: sql/10_daily_revenue.sql, dependsOn: [schema]}
  - {name: customer_ltv, sqlFile: sql/11_customer_ltv.sql, dependsOn: [schema]}
  - {name: product_mix, sqlFile: sql/12_product_mix.sql, dependsOn: [schema]}
