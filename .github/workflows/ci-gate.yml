# One always-running check that judges the others, so the main ruleset can require it.
#
# Every other workflow here has a top-level `paths:` filter, so a check that did not run on a
# pull request would stay "expected" for ever if it were required by name. This workflow has no
# filter: it runs on every pull request, waits for the checks that did run, and fails if any of
# them did not pass.
name: "ci gate"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  checks: read
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for every other check on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          prev=""
          while true; do
            now=$(date +%s)
            elapsed=$(( now - start ))
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100")

            # The gate's own run is never part of the judgement.
            others=$(jq '[.check_runs[] | select(.name != "gate")]' <<<"$runs")
            total=$(jq 'length' <<<"$others")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$others")
            failed=$(jq -r '.[]
              | select(.status == "completed")
              | select((.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral") | not)
              | .name' <<<"$others")
            names=$(jq -r '[.[].name] | sort | join(",")' <<<"$others")

            if [ -n "$failed" ]; then
              echo "Check(s) did not pass:"
              printf '%s\n' "$failed"
              exit 1
            fi

            echo "elapsed=${elapsed}s other_runs=$total pending=$pending"
            jq -r '.[] | "  \(.name) | \(.status) | \(.conclusion // "-")"' <<<"$others"

            # Done: 60 s have passed (so path-filtered workflows had time to register), every
            # other run is completed, and the set of run names is the same as on the last poll.
            # No other run at all passes here too: a pull request that changes no filtered path.
            if [ "$elapsed" -ge 60 ] && [ "$pending" -eq 0 ] && [ "$names" = "$prev" ]; then
              echo "All other checks finished."
              exit 0
            fi

            prev="$names"
            sleep 20
          done
