# The platform namespace's Pod Security floor (platform#1096 question 5).
#
# `baseline` is enforced: no privileged container, no host network/PID/IPC, no hostPath.
# Every running pod is admitted. `restricted` is only warned and audited: Lakekeeper's
# `opa` sidecar does not pass it yet (#1095, chart 0.14.0). The five SeaweedFS pods pass
# `restricted` since platform#1758 (uid/gid 65534, `emptyDir` logs).
apiVersion: v1
kind: Namespace
# Applied by `make step-namespace`, which renders `name` from `$(NAMESPACE)`.
metadata:
  name: stardelt
  labels:
    app.kubernetes.io/part-of: stardelt
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
