{{- if and .Values.ingress.enabled (eq (.Values.ingress.mode | default "ingress") "ingress") }}
{{- /*
  This renders when `ingress.mode` is `ingress`; gateway mode is `httproute.yaml`, built
  from the same list in `_ingress.tpl`.

  One Ingress per installed component, so an administrator gets reachability
  without hand-writing YAML. Deliberately generic: the class, the host pattern
  and TLS are all settings, and nothing here assumes a particular controller.

  Components without a sign-in of their own (trino, lakekeeper, superset,
  airflow, jupyterhub) render only when named in `ingress.exposeUnauthenticated`.

  Paths default to `/`; Trino publishes only what external SQL clients need
  (`/v1/statement`, `/oauth2`), never its web UI or `/v1/info` (platform#181);
  Keycloak publishes the realm's public surface
  (`/realms/stardelt`, `/resources`, `/robots.txt`) plus the `stardelt` realm's
  admin console and its REST API. Its paths are plain prefixes (pathType Prefix)
  so they route the same under ingress-nginx and Traefik; the master-realm
  console is not published. A path entry is either a string (Prefix) or a
  mapping of `path` + `pathType`.

  Host resolution, per service: `ingress.hosts.<name>` wins; otherwise
  `<sub>.<platform.baseDomain>`; otherwise nothing is rendered for that service
  (a reachable-only-by-Service setup stays valid).
*/}}
{{- $base := .Values.platform.baseDomain | default "" }}
{{- $tls := .Values.ingress.tls }}
{{- $extraAnnotations := .Values.ingress.annotations }}
{{- $allowed := .Values.ingress.allowedCidrs | default list }}
{{- if gt (len $allowed) 64 }}
{{- fail "ingress.allowedCidrs: at most 64 entries" }}
{{- end }}
{{- range $allowed }}
{{- if not (regexMatch "^[0-9a-fA-F:.]+/[0-9]{1,3}$" (toString .)) }}
{{- fail (printf "ingress.allowedCidrs: %q is not a CIDR such as 203.0.113.0/24" (toString .)) }}
{{- end }}
{{- end }}
{{- $overrides := .Values.ingress.hosts | default dict }}
{{- $unauthenticated := list "trino" "lakekeeper" "superset" "airflow" "jupyterhub" }}
{{- $exposed := .Values.ingress.exposeUnauthenticated | default list }}
{{- $services := fromYamlArray (include "stardelt.ingress.services" .) }}
{{- range $services }}
{{- if and .enabled (or (not (has .name $unauthenticated)) (has .name $exposed)) }}
{{- $host := "" }}
{{- $overridden := index $overrides .name | default "" }}
{{- if $overridden }}
{{- $host = $overridden }}
{{- else if $base }}
{{- if .sub }}
{{- $host = printf "%s.%s" .sub $base }}
{{- else }}
{{- $host = $base }}
{{- end }}
{{- end }}
{{- if $host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: stardelt
  {{- if or $extraAnnotations (and $tls.enabled $tls.issuer) $allowed }}
  annotations:
    {{- with $extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and $tls.enabled $tls.issuer }}
    cert-manager.io/cluster-issuer: {{ $tls.issuer | quote }}
    {{- end }}
    {{- if $allowed }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ join "," $allowed | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $tls.secretNameTemplate | replace "{host}" (replace "." "-" $host) | quote }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- $service := . }}
          {{- range (.paths | default (list "/")) }}
          {{- if kindIs "string" . }}
          - path: {{ . | quote }}
            pathType: Prefix
          {{- else }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
          {{- end }}
            backend:
              service:
                name: {{ $service.service }}
                port:
                  number: {{ $service.port }}
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
