# The catalog database is the CloudNative-PG Cluster `lakekeeper-pg` that the
# operator applies itself (prerequisites.rs); the short Service name resolves
# inside the Lakehouse's namespace. Permissions are enforced through the OpenFGA
# release the operator deploys; the bundled Postgres and OpenFGA are off.
helmWait: true
postgresql:
  enabled: false
externalDatabase:
  type: postgres
  host_read: lakekeeper-pg-rw
  host_write: lakekeeper-pg-rw
  port: 5432
  database: lakekeeper
  userSecret: lakekeeper-pg-app
  userSecretKey: username
  passwordSecret: lakekeeper-pg-app
  passwordSecretKey: password
# Workloads authenticate with a projected ServiceAccount token (twin of
# platform/helm-values/lakekeeper.yaml's `auth.k8s`, stardelt/stardelt#492). The audience matches
# `platform/scripts/spike-k8s-auth.sh`; authentication only, `authz.backend: openfga` decides.
auth:
  k8s:
    enabled: true
    audience: stardelt-catalog-workload
    createClusterRoleBinding: true
# The catalog's permissions live in OpenFGA (twin of platform/helm-values/lakekeeper.yaml's
# `authz`, #1617). The chart's migration Job writes the authorization model during the
# release, so the operator applies a new catalog only once the `openfga` release's workloads
# are ready (controller.rs, `permission_store_up`).
authz:
  backend: openfga
  openfga:
    endpoint: http://openfga.__NAMESPACE__.svc.cluster.local:8081
internalOpenFGA: false
catalog:
  # Pinned by digest (the twin of stardelt-platform#1587 and #972). The chart version pins the
  # chart; `catalog.image.tag` is the catalog image. The string is
  # stardelt-platform/helm-values/lakekeeper.yaml:426.
  image:
    tag: "v0.15.0@sha256:b02a882df48042020c473a79b980a643fcc883a6f9c21b74c5b7cc8eabeec9fe"
  # Pod Security `restricted` (platform#1096 question 5, twin of platform#1196). Both keys are the
  # chart's camelCase catalog keys; each REPLACES the chart's block for the catalog Deployment, its
  # `check-db` init container and the `lakekeeper-db-migration-<revision>` Job. The chart keeps
  # `runAsUser: 65532` / `runAsGroup: 65534` from `catalog.image.uid/gid`, and `restricted` does not
  # constrain `fsGroup`; `runAsNonRoot` and `seccompProfile` are what complete the profile. This
  # path does not enable the chart's OPA bridge, so it renders no `opa` sidecar and no exception.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: ["ALL"]}
    seccompProfile: {type: RuntimeDefault}
  prometheus:
    # The chart adds a `metrics` port (9000) to the `lakekeeper` Service and the
    # scrape annotations to the pod; the metrics server itself is always on (#607).
    setScrapeAnnotations: true
