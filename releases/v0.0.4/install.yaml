          spec:
            description: 'A managed lakehouse: catalog + storage (+ query) on object storage.'
            properties:
              adopt:
                default: false
                description: |-
                  Take over Helm releases this operator did not create. Off by default so a
                  Lakehouse can never silently clobber an existing install.
                type: boolean
              catalog:
                default:
                  implementation: lakekeeper
                properties:
                  implementation:
