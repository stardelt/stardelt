{{- if .Values.s3Credentials.create }}
{{- /*
  S3 credentials for the lakehouse storage layer, generated on first install.

  Two Secrets carry the same key pair:
    * `s3Credentials.name` (stardelt-s3-creds): read by every consumer (the Trino
      catalog, the Lakekeeper bootstrap Job, Airflow, CNPG backups).
    * `seaweedfs-s3-config`: one JSON document the SeaweedFS S3 gateway reads twice —
      `-config` for the identities, `-iam.config` for the STS/IAM half
      (seaweedfs.s3.existingConfigSecret and s3.extraArgs in values.yaml).
  Values come from `s3Credentials.accessKey` / `.secretKey` when set, else from the
  existing Secret (kept across `helm upgrade`), else random. Both Secrets are kept on
  uninstall. To rotate, see docs: operations/rotating-secrets.
  `helm template` has no cluster to look up, so it always shows fresh values.
*/}}
{{- $name := .Values.s3Credentials.name }}
{{- $ak := .Values.s3Credentials.accessKey | default (include "stardelt.secretValue" (list . $name "access-key") | b64dec) }}
{{- $sk := .Values.s3Credentials.secretKey | default (include "stardelt.secretValue" (list . $name "secret-key") | b64dec) }}
{{- $sts := .Values.s3Credentials.stsSigningKey | default (include "stardelt.secretValue" (list . $name "sts-signing-key")) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: stardelt
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  access-key: {{ $ak | quote }}
  secret-key: {{ $sk | quote }}
  sts-signing-key: {{ $sts | quote }}
  endpoint: {{ tpl .Values.s3Credentials.endpoint . | quote }}
  bucket: {{ .Values.s3Credentials.bucket | quote }}
  region: {{ .Values.s3Credentials.region | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: stardelt
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  seaweedfs_s3_config: {{ dict "identities" (list (dict "name" "stardelt" "credentials" (list (dict "accessKey" $ak "secretKey" $sk)) "actions" (list "Admin" "Read" "Write"))) "sts" (dict "signingKey" $sts) "policy" (dict "storeType" "memory" "defaultEffect" "Deny") "policies" (list (dict "name" "stardelt-all" "document" (dict "Version" "2012-10-17" "Statement" (list (dict "Effect" "Allow" "Action" (list "s3:*") "Resource" (list "arn:aws:s3:::*")))))) "roles" (list (dict "roleName" "stardelt" "roleArn" "arn:aws:iam::000000000000:role/stardelt" "trustPolicy" (dict "Version" "2012-10-17" "Statement" (list (dict "Effect" "Allow" "Principal" (dict "AWS" "arn:aws:iam::000000000000:user/stardelt") "Action" (list "sts:AssumeRole")))) "attachedPolicies" (list "stardelt-all"))) | toJson | quote }}
{{- end }}
