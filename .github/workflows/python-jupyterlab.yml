name: "python / JupyterLab extension"

on:
  pull_request:
    paths: ["python/jupyterlab/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  test:
    name: Extension (build, jest, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install JupyterLab and the build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U "jupyterlab>=4.0.0,<5" build

      - name: Install the JavaScript dependencies
        working-directory: python/jupyterlab
        run: jlpm install

      - name: Build the extension
        working-directory: python/jupyterlab
        run: |
          jlpm build
          python -m pip install ".[test]"
          # The publish handlers call the library that ships beside this
          # package (`from stardelt.publish import publish`), so its tests need
          # it installed; the image gets both from the same commit.
          python -m pip install ..

      - name: Run the template's tests
        working-directory: python/jupyterlab
        run: |
          jlpm run test
          pytest -q

      - name: Check that JupyterLab finds the extension
        working-directory: python/jupyterlab
        run: |
          jupyter server extension list 2>&1 | grep -ie "stardelt_jupyterlab.*OK"
          jupyter labextension list 2>&1 | grep -ie "@stardelt/jupyterlab.*OK"
