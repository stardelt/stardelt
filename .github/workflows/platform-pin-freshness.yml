name: "platform / Pin freshness"
on:
  schedule: [{cron: "17 4 * * *"}]
  workflow_dispatch:
  pull_request:
    paths:
      - platform/manifests/**
      - platform/helm-values/**
      - platform/chart/values.yaml
      - platform/chart/files/spark-runtimes.json
      - operator/crates/stardelt-operator/src/provision.rs
      - .github/workflows/platform-pin-freshness.yml
permissions:
  contents: read
  issues: write
defaults:
  run:
    working-directory: platform

jobs:
  pins:
    name: The checked-in pins and the operator's golden-value checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The operator is ../operator in this checkout; full history so check_golden_image.py can
      # read NOVA_IMAGE at the commit the pinned operator image was built from.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare
        id: check
        run: |
          set +e
          # `$?` after a pipeline is tee's status, not the check's: that is why the
          # issue was never filed (found 2026-11-09; `false | tee` answers 0). Redirect,
          # read the code, print. All three checks feed one issue: an operator whose golden
          # values disagree is the same class of drift as an image pin that is behind.
          python3 scripts/check_pin_freshness.py > "$RUNNER_TEMP/pins.txt" 2>&1
          freshness=$?
          OPERATOR_DIR=../operator bash scripts/check-operator-pins.sh >> "$RUNNER_TEMP/pins.txt" 2>&1
          operator=$?
          # The operator image the platform pins is a build of one commit; that commit's
          # NOVA_IMAGE is what an operator install renders. The check above reads the operator's
          # origin/main instead, so both were green while an install rendered Nova one build
          # behind (stardelt-operator#545).
          OPERATOR_DIR=../operator python3 scripts/check_golden_image.py >> "$RUNNER_TEMP/pins.txt" 2>&1
          golden=$?
          # A rollup that moves Airflow or Jupyter writes the operator's golden values and pins a
          # build of the PREVIOUS commit: until the next rollup pins this commit's build, the
          # operator renders the old values, and every other check agrees (#330, #516).
          OPERATOR_DIR=../operator python3 scripts/check_golden_values.py >> "$RUNNER_TEMP/pins.txt" 2>&1
          golden_values=$?
          cat "$RUNNER_TEMP/pins.txt"
          if [ "$freshness" -ne 0 ] || [ "$operator" -ne 0 ] || [ "$golden" -ne 0 ] || [ "$golden_values" -ne 0 ]; then
            echo "code=1" >> "$GITHUB_OUTPUT"
          else
            echo "code=0" >> "$GITHUB_OUTPUT"
          fi
      - name: File or refresh the issue
        if: steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Pins are stale: an image pin or the operator’s golden values disagree'
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"Pins are stale\"" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pins.txt"
          else
            milestone="$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=open&per_page=100" \
              --jq '[.[].title | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(split(".") | map(tonumber)) | first')"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --label bug --label P2 --label ops --label area/platform --milestone "$milestone" --body-file "$RUNNER_TEMP/pins.txt"
          fi
      - name: Close the issue when all four checks pass
        if: steps.check.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "Pins are stale"' --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "no open pin issue"
            exit 0
          fi
          gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "All four checks pass again at ${GITHUB_SHA}: \`check_pin_freshness.py\`, \`check-operator-pins.sh\`, \`check_golden_image.py\` and \`check_golden_values.py\` are green, so this issue is closed. The maintenance CLI image decision is platform#1571."
          gh issue close "$number" --repo "$GITHUB_REPOSITORY"

  pr-pins:
    name: A pin this pull request changes is not behind the registry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history: `--changed` diffs against the base ref, and `pin_text` reads a commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare the changed pins with the registry
        working-directory: platform
        env:
          # Through the environment, not interpolated: a ref name must not become shell code.
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 scripts/check_pin_freshness.py \
            --changed --base "origin/$BASE_REF" --rev HEAD
