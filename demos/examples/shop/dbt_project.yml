name: shop
version: "1.0.0"
config-version: 2
profile: shop

model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]
macro-paths: [macros]
snapshot-paths: [snapshots]

# How many order lines the generator builds inside Trino. A multiple of 1000.
# 200 000 runs in seconds on the dev node; try 5 000 000 for a heavier demonstration.
vars:
  scale: 200000

# The layers are the catalogs: seeds and the generated lines go to bronze, the staging views
# to silver, the marts to gold. Every layer uses the schema `shop_dbt`.
seeds:
  shop:
    +database: bronze
    +schema: shop_dbt
    +tags: [seed]
    +column_types:
      id: integer
      unit_price: "decimal(10,2)"

models:
  shop:
    bronze:
      +database: bronze
      +schema: shop_dbt
      +materialized: table
      +tags: [load]
    staging:
      +database: silver
      +schema: shop_dbt
      +materialized: view
      # Trino writes `trino.run-as-owner` for a SECURITY DEFINER view, and Lakekeeper 0.15
      # refuses that property unless Trino is a configured trusted engine (stardelt#393).
      # The staging views are internal to this project: the marts read them as the pipeline
      # principal, so they run with the querying identity instead.
      +view_security: invoker
      +tags: [load]
    marts:
      +database: gold
      +schema: shop_dbt
      +materialized: table
      +tags: [marts]
      +persist_docs:
        relation: true
        columns: true

snapshots:
  shop:
    +target_database: silver
    +target_schema: shop_dbt
    +tags: [marts]
