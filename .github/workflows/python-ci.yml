name: "python / CI"

on:
  push:
    branches: [main]
    paths: ["python/**", "nova/openapi/nova.json", ".github/workflows/python-ci.yml"]
  pull_request:
    paths: ["python/**", "nova/openapi/nova.json", ".github/workflows/python-ci.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  test:
    name: Library (pytest, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install the library and its test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,jupyter]"

      - name: Run the tests
        run: python -m pytest tests -q

      - name: The SDK lists every operation the contract has
        run: |
          python scripts/sync_contract.py
          git -C .. diff --exit-code -- python/stardelt/operations.json

  image-cli-check:
    name: Build the CLI image (no push)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Build ghcr.io/stardelt/stardelt-cli:dev (not pushed)
        run: docker build --build-arg REVISION="${{ github.sha }}" -t ghcr.io/stardelt/stardelt-cli:dev -f image/Dockerfile .

      - name: The image runs the maintenance command
        run: |
          docker run --rm ghcr.io/stardelt/stardelt-cli:dev maintenance run --help
          docker run --rm ghcr.io/stardelt/stardelt-cli:dev maintenance run --help \
            | grep -q 'usage: stardelt maintenance run'

      - name: The image names the commit it was built from
        run: |
          got="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' ghcr.io/stardelt/stardelt-cli:dev)"
          if [ "$got" != "${{ github.sha }}" ]; then
            echo "revision label is '$got', expected '${{ github.sha }}'" >&2
            exit 1
          fi

  image-cli:
    name: Push the CLI image
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: The image tag and the commit this build publishes
        id: image
        run: |
          tag=dev
          echo "tag=${tag#python/}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push the CLI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: python
          file: python/image/Dockerfile
          build-args: REVISION=${{ steps.image.outputs.sha }}
          push: true
          sbom: true
          tags: ghcr.io/stardelt/stardelt-cli:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
