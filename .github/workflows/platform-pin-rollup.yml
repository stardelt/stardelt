name: "platform / Pin rollup"
on:
  schedule: [{ cron: "*/30 * * * *" }]
  # GitHub's scheduler on this repository fires the */30 cron about every eight hours
  # (measured 2026-11-09..11). A push to main that rebuilds a pinned image must roll its pin
  # now, not eight hours later; the cron stays as a backstop. Since D49 the pinned images come
  # from four workflows: platform / Image, operator / Image, nova / Image and demos / CI
  # (which pushes the Airflow loader, `ghcr.io/stardelt/airflow:demo`).
  workflow_run:
    workflows: ["platform / Image", "operator / Image", "nova / Image", "demos / CI"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  # #746: the rollup dispatches `operator / Image` from the rolling branch when it moved a pin
  # the operator embeds (GITHUB_TOKEN with actions: write; PIN_TOKEN has no Actions permission).
  actions: write
# A run that waits on the dispatched operator build (#1032) must not be cancelled by the next
# cron or push run: the branch already carries the moved pin and would keep the old operator
# digest (#1037). A queued run is cheap; the cron fires every 30 minutes anyway. GitHub keeps
# one pending run and cancels the older pending one, so the newest commit still wins.
concurrency: { group: platform-pin-rollup, cancel-in-progress: false }
defaults:
  run:
    working-directory: platform

jobs:
  rollup:
    # A PR build pushes no image, so it must not roll the pins. A push to main and a manual
    # Image run both push one, so both roll: a dispatched rebuild that moves a digest would
    # otherwise wait for the next cron — the same delay this trigger exists to remove
    # (platform#1013). The guard is per workflow, so it covers all four Image/push workflows.
    # #746 adds the head-branch guard: the rollup dispatches `operator / Image` from
    # `chore/pin-rollup`, and without this the completion of that build would fire a second
    # rollup while the first is still waiting on it (#1037). A build of a
    # tag or any other non-default branch moved no `dev` tag either, so nothing is lost.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A push made with GITHUB_TOKEN triggers no pull_request workflow, so the two
          # required checks never report and every pin cycle needs an admin merge
          # (platform#1069). PIN_TOKEN is a fine-grained token on this repository only;
          # checkout persists it, so the script's `git push` is a user push. Falls back
          # to GITHUB_TOKEN where the secret is absent (platform#648 behaviour).
          token: ${{ secrets.PIN_TOKEN || github.token }}
      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          # Exact version, for the reason in ci.yml: a partial pin resolves through
          # the get.helm.sh metadata and fails the job.
          version: "3.19.0"
      - name: Lint the script
        run: bash -n scripts/pin-rollup.sh && shellcheck scripts/pin-rollup.sh
      # `helm lint chart` renders the umbrella chart's templates. Its sub-charts are
      # not fetched here on purpose: GitHub release downloads have answered 504 twice
      # in one day, and a roll must not depend on that weather. The pins live in
      # helm-values/ and manifests/, not in chart/, so the templates are what matters.
      - name: Roll the pins, refresh the rolling PR
        run: OPEN_PR=1 bash scripts/pin-rollup.sh
        env:
          GH_TOKEN: ${{ secrets.PIN_TOKEN || github.token }}
          PIN_TOKEN_SET: ${{ secrets.PIN_TOKEN != '' }}
          # #746: the dispatch needs an Actions-capable token, and `gh` would otherwise fall
          # back to GH_TOKEN (PIN_TOKEN), which answers 403.
          GITHUB_TOKEN: ${{ github.token }}
