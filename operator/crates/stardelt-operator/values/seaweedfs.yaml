# The data must outlive the pod: emptyDir/hostPath wipe on restart and
# orphan the Iceberg metadata pointing at the files. The S3 endpoint is
# what the catalog and engines talk to, so it is on by default.
# The chart's swap/migration hook ships a cluster-scoped ClusterRole
# (`seaweedfs-rw-cr`). Cluster-scoped means one per cluster, so leaving
# it on makes the second lakehouse in a cluster fail to install — and
# several lakehouses per cluster is the point of this CRD. Off here for
# the same reason the platform chart sets it off.
# Pinned by digest (the twin of stardelt-platform#1587). The chart's appVersion tag is `4.55`;
# the digest is what the kubelet pulls. The string is
# stardelt-platform/helm-values/seaweedfs.yaml:8.
image:
  tag: "4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9"
global:
  seaweedfs:
    createClusterRole: false
# The PVC type carries no default size in the chart, so every claim needs one
# here: an empty request is refused by the API server, the whole install fails.
master:
  data:
    type: persistentVolumeClaim
    size: 1Gi
  # Pod Security `baseline` refuses hostPath, and the chart defaults every component's log
  # volume to one (stardelt-platform#1096 question 5). Logs are disposable, not data.
  logs:
    type: emptyDir
  # Pod Security `restricted` (stardelt-platform#1095): the chart renders these two blocks
  # only when `enabled: true`, and drops the key itself. uid 65534 is the probe user that
  # wrote an emptyDir as fsGroup 65534 on the lab (stardelt-platform#1758).
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities: {drop: ["ALL"]}
    seccompProfile: {type: RuntimeDefault}
volume:
  dataDirs:
  - name: data
    type: persistentVolumeClaim
    size: 20Gi
    # Volume slots. The chart's default (0 → auto-configure, 7 on Linux) is a trap
    # on a small install: once the slots are used up, the master cannot create a
    # volume for a *new* collection, and writes to a new bucket block forever —
    # the client sees a hang, the master log says "failed to find writable volumes
    # … Not enough data nodes found", and buckets created earlier keep working.
    maxVolumes: 100
  # Pod Security `restricted` (stardelt-platform#1095): the chart renders these two blocks
  # only when `enabled: true`, and drops the key itself. uid 65534 is the probe user that
  # wrote an emptyDir as fsGroup 65534 on the lab (stardelt-platform#1758).
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities: {drop: ["ALL"]}
    seccompProfile: {type: RuntimeDefault}
filer:
  data:
    type: persistentVolumeClaim
    size: 1Gi
  # Pod Security `baseline` refuses hostPath, and the chart defaults every component's log
  # volume to one (stardelt-platform#1096 question 5). Logs are disposable, not data.
  logs:
    type: emptyDir
  # Pod Security `restricted` (stardelt-platform#1095): the chart renders these two blocks
  # only when `enabled: true`, and drops the key itself. uid 65534 is the probe user that
  # wrote an emptyDir as fsGroup 65534 on the lab (stardelt-platform#1758).
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities: {drop: ["ALL"]}
    seccompProfile: {type: RuntimeDefault}
# The S3 identities come from Secret `seaweedfs-s3-config`, written by the
# operator from the same key pair as `stardelt-s3-creds`; no key in values.
s3:
  enabled: true
  enableAuth: true
  existingConfigSecret: seaweedfs-s3-config
  # The same document carries the STS/IAM half (`sts.signingKey`, `policy`, `policies`, `roles`);
  # the gateway reads it a second time for STS (stardelt/stardelt#256, twin #262, spike #248).
  # The identities pass logs `invalid policy` for the keys it ignores; `-iam.config` loads them.
  # A `byoS3` document without the half logs one `Failed to load IAM configuration` and still
  # serves the identities (measured, #239 Q2) — the flag is not a hard dependency.
  extraArgs:
    - -iam.config=/etc/sw/seaweedfs_s3_config
  # Pod Security `baseline` refuses hostPath, and the chart defaults every component's log
  # volume to one (stardelt-platform#1096 question 5). Logs are disposable, not data.
  logs:
    type: emptyDir
  # platform#1219: the gateway holds ~1.44 Mi of live Go heap per Mi it serves, so a
  # 2.89 GB Iceberg scan needs ~4.1 Gi and OOM-kills a 1 Gi container. Keep in step
  # with stardelt-platform/helm-values/seaweedfs.yaml.
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "2",    memory: "5.5Gi" }
  # Pod Security `restricted` (stardelt-platform#1095): the chart renders these two blocks
  # only when `enabled: true`, and drops the key itself. uid 65534 is the probe user that
  # wrote an emptyDir as fsGroup 65534 on the lab (stardelt-platform#1758).
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities: {drop: ["ALL"]}
    seccompProfile: {type: RuntimeDefault}
  createBuckets:
  - name: lakehouse
    anonymousRead: false
  - name: backups
    anonymousRead: false
