name: Something does not work
description: Tell us what went wrong, and which release you run.
labels: [bug, community]
body:
  - type: markdown
    attributes:
      value: Thank you. The release you run and the output of `stardelt doctor` let us reproduce it.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: I clicked … and saw …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - Nova (the interface)
        - Install or upgrade
        - Notebooks
        - Pipelines
        - Dashboards
        - SQL / query engine
        - Python package or CLI
        - Documentation
        - The demo at stardelt.io/demo
        - I don't know
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release
      description: The release you installed, a commit if you built from a checkout, or 'demo'.
      placeholder: v0.0.4
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `stardelt doctor`
      description: Run it on the machine where the problem shows. It prints no token; remove anything you do not want to share.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove passwords and tokens before you paste.
      render: shell
