name: "deploy / Federated proof"
# workflow_dispatch only: this runs against the live lab as a DeployStage's principal (#57).
on:
  workflow_dispatch:
    inputs:
      client_id:
        description: "the deploy client a DeployStage rendered (stardelt-deploy-<stage>)"
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      STARDELT_NOVA_URL: https://alpha.dev.stardelt.io
    steps:
      - uses: actions/checkout@v7
      - name: The CI identity token
        run: |
          set -euo pipefail
          token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=stardelt-deploy" | jq -r .value)"
          [ -n "$token" ] && [ "$token" != "null" ]
          echo "::add-mask::$token"
          echo "CI_TOKEN=$token" >> "$GITHUB_ENV"
          printf '%s' "$token" | python3 -c '
          import base64, json, sys
          part = sys.stdin.read().strip().split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
          print("sub=" + claims["sub"])
          print("aud=" + json.dumps(claims.get("aud")))
          print("iss=" + claims.get("iss", ""))
          ' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install the CLI
        run: python3 -m pip install ./python
      - name: Sign in with the stage's federated client
        run: |
          stardelt login --federated --client-id "${{ inputs.client_id }}" --assertion-env CI_TOKEN
      - name: Plan a deploy — writes nothing
        run: stardelt bundle plan demos/examples/shop-bundle -t dev --format markdown
