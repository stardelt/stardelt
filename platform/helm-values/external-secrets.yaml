# External Secrets Operator (Apache-2.0): syncs a secret store's values into Kubernetes Secrets
# (decision D23). Opt-in: `make external-secrets`. One replica of each of its three small workloads.
installCRDs: true
replicaCount: 1
resources:
  requests: { cpu: 20m, memory: 48Mi }
  limits: { memory: 192Mi }
# Pinned by digest (platform#1623). The chart version pins the chart, not the image, so without
# this block the three Deployments float on whatever tag `EXTERNAL_SECRETS_VERSION` names.
# `webhook.image` and `certController.image` are separate values in this chart.
image:
  tag: "v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31"
webhook:
  image:
    tag: "v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31"
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
certController:
  image:
    tag: "v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31"
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
