# Source: stardelt-operator/templates/operator.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stardelt-operator
  namespace: stardelt
  labels:
    app: stardelt-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stardelt-operator
  template:
    metadata:
      labels:
        app: stardelt-operator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: stardelt-operator
      # Pod Security `restricted` (platform#1096 question 5): the image's Dockerfile
      # ends in `USER 65532:65532`; these four fields are what the level requires and
      # what the pod asserts. `readOnlyRootFilesystem` is deliberately not set: Helm
      # needs its cache/config/data directories under /home/operator.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "ghcr.io/stardelt/stardelt-operator:v0.0.4@sha256:928ae75115a8825ee23ea378a9dceab94c61196639bb55285049f2e605fddc87"
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8082
          env:
            - name: RUST_LOG
              value: "info"
            # Leader election (#75): the Lease stardelt-operator-leader names this pod.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
