[workspace]
resolver = "2"
members = ["crates/stardelt-operator", "crates/stardelt-crds"]

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
stardelt-crds = { path = "crates/stardelt-crds" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
kube = { version = "5.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.29", features = ["latest"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
futures = "0.3"
getrandom = "0.4"
bcrypt = "0.19"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
