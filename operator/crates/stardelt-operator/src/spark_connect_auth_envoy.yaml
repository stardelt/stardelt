admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
static_resources:
  listeners:
    - name: spark-connect
      address:
        socket_address: { address: 0.0.0.0, port_value: 15002 }
      # The network filter lives in a filter chain: Envoy's Listener has no `filters`
      # of its own (v1.35 refuses that config, "no such field: 'filters'").
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: spark_connect
                codec_type: AUTO
                # A query stream is silent while an executor works (#208).
                stream_idle_timeout: 0s
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: spark
                  virtual_hosts:
                    - name: spark
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: spark_connect
                            timeout: 0s
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keycloak:
                          issuer: __ISSUER_URL__
                          audiences: ["__AUDIENCE__"]
                          # Hand the verified JWT on: the upstream is where an identity would
                          # have to be read from (the Connect server reads none today, #208).
                          forward: true
                          # The RBAC filter below matches on the verified payload's group claim.
                          payload_in_metadata: jwt_payload
                          remote_jwks:
                            http_uri:
                              uri: __JWKS_URI__
                              cluster: __JWKS_CLUSTER__
                              timeout: 5s
                            cache_duration: 300s
                      rules:
                        - match: { prefix: "/" }
                          requires: { provider_name: keycloak }
                  # A verified token is not yet a member: the RBAC filter is the gate. It reads
                  # the instance's group claim (short names: the platform realm sets
                  # `full.path: false`) and admits exactly the members group and the instance's
                  # admin group. `visitors` — the public demo's group — is in neither and gets
                  # PERMISSION_DENIED (Envoy answers 403, gRPC maps it).
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          members:
                            permissions: [{ any: true }]
                            principals:
                              - metadata:
                                  filter: envoy.filters.http.jwt_authn
                                  path: [{ key: jwt_payload }, { key: __GROUP_CLAIM__ }]
                                  value:
                                    list_match:
                                      one_of:
                                        string_match: { exact: "stardelt-users" }
                              - metadata:
                                  filter: envoy.filters.http.jwt_authn
                                  path: [{ key: jwt_payload }, { key: __GROUP_CLAIM__ }]
                                  value:
                                    list_match:
                                      one_of:
                                        string_match: { exact: "__ADMIN_GROUP__" }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: spark_connect
      connect_timeout: 5s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            # gRPC upstream: Envoy must not downgrade to HTTP/1 (#208).
            http2_protocol_options: {}
      load_assignment:
        cluster_name: spark_connect
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: spark-connect.__NAMESPACE__.svc.cluster.local, port_value: 15002 }
    - name: keycloak
      connect_timeout: 5s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: keycloak
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: keycloak.__NAMESPACE__.svc.cluster.local, port_value: 8080 }
    # The customer's JWKS host for `identity.mode: external`; unused in platform mode, where
    # `__JWKS_CLUSTER__` is `keycloak` and this cluster goes unused.
    - name: jwks
      connect_timeout: 5s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: __JWKS_TLS_HOST__
      load_assignment:
        cluster_name: jwks
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: __JWKS_TLS_HOST__, port_value: 443 }
