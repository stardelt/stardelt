# Spike stardelt/stardelt#830 — exists on branch spike/830-ci-token only, never on main.
# Asks this job for a GitHub Actions OIDC token (audience stardelt-deploy) and presents it to the
# pinned Keycloak (realm spike-ci) by the three mechanisms the ticket names. Prints HTTP status and
# error bodies, never a token: only claims that are not secret and a sha256 prefix.
name: spike-ci-token
on:
  push:
    branches: ["spike/830-ci-token"]
  pull_request:
permissions:
  contents: read
  id-token: write
jobs:
  mechanisms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: request, decode, present
        env:
          KC: https://id.alpha.dev.stardelt.io/realms/spike-ci/protocol/openid-connect/token
          CLIENT_SECRET: ${{ secrets.SPIKE_CI_CLIENT_SECRET }}
        run: |
          set -u
          T="$(mktemp)"; T2="$(mktemp)"; TW="$(mktemp)"; TE="$(mktemp)"
          tok() { # $1 audience, $2 outfile
            curl -sS -f -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$1" \
              | python3 -c 'import sys,json;sys.stdout.write(json.load(sys.stdin)["value"])' > "$2"
            echo "  requested aud=$1 sha256[0:16]=$(sha256sum "$2" | cut -c1-16) bytes=$(wc -c < "$2")"
          }
          claims() { # $1 file holding a JWT
            if [ ! -s "$1" ]; then echo "  no token to decode (file empty or absent)"; return 0; fi
            python3 - "$1" <<'PY'
          import sys, json, base64
          t = open(sys.argv[1]).read().strip()
          _, p, _ = t.split(".")
          c = json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))
          keep = ["iss", "aud", "azp", "sub", "groups", "jti", "repository", "ref",
                  "event_name", "typ", "scope"]
          out = {k: c[k] for k in keep if k in c}
          if "exp" in c and "iat" in c:
              out["exp-iat"] = c["exp"] - c["iat"]
          print("  claims:", json.dumps(out, sort_keys=True))
          PY
          }
          post() { # $1 label, $2 outfile, rest: curl args
            local label="$1" out="$2"; shift 2
            local code
            code="$(curl -sS -o "$out" -w '%{http_code}' "$@")"
            echo "  $label -> HTTP $code"
            python3 - "$out" <<'PY'
          import sys, json
          try:
              d = json.load(open(sys.argv[1]))
          except Exception:
              print("    body: <not json>"); sys.exit()
          if "error" in d:
              print("    error=%s description=%s" % (d.get("error"), d.get("error_description")))
          else:
              print("    response keys=%s" % ",".join(sorted(d.keys())))
          PY
          }
          at() { # $1 outfile holding a token response -> access token file
            python3 - "$1" <<'PY'
          import sys, json
          d = json.load(open(sys.argv[1]))
          open(sys.argv[1] + ".at", "w").write(d.get("access_token", ""))
          PY
            echo "$1.at"
          }
          JB=urn:ietf:params:oauth:client-assertion-type:jwt-bearer

          echo "== token A (audience stardelt-deploy) =="
          tok stardelt-deploy "$T"
          echo "-- what GitHub signed --"
          claims "$T"

          echo "== (b) federated-jwt client authentication, client spike-ci-federated =="
          post "b" "$RUNNER_TEMP/b.json" -X POST "$KC" \
            --data-urlencode client_id=spike-ci-federated \
            --data-urlencode grant_type=client_credentials \
            --data-urlencode client_assertion_type="$JB" \
            --data-urlencode client_assertion@"$T"
          echo "-- issued token --"
          claims "$(at "$RUNNER_TEMP/b.json")"

          echo "== (b) replay of the same assertion =="
          post "b-replay" "$RUNNER_TEMP/br.json" -X POST "$KC" \
            --data-urlencode client_id=spike-ci-federated \
            --data-urlencode grant_type=client_credentials \
            --data-urlencode client_assertion_type="$JB" \
            --data-urlencode client_assertion@"$T"

          echo "== (a) jwt-bearer grant, client spike-ci-jwt (client secret) =="
          tok stardelt-deploy "$T2"
          post "a" "$RUNNER_TEMP/a.json" -X POST "$KC" \
            --data-urlencode client_id=spike-ci-jwt \
            --data-urlencode client_secret="$CLIENT_SECRET" \
            --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
            --data-urlencode assertion@"$T2"
          echo "-- issued token --"
          claims "$(at "$RUNNER_TEMP/a.json")"

          echo "== (a) without a user linked to the assertion sub =="
          echo "  (the linked user is spike-ci-deployer for refs/heads/spike/830-keycloak-ci)"

          echo "== (c) client-jwt authenticator, client spike-ci-selfsigned =="
          tok stardelt-deploy "$T" >/dev/null
          post "c" "$RUNNER_TEMP/c.json" -X POST "$KC" \
            --data-urlencode client_id=spike-ci-selfsigned \
            --data-urlencode grant_type=client_credentials \
            --data-urlencode client_assertion_type="$JB" \
            --data-urlencode client_assertion@"$T"

          echo "== refusal: wrong audience, mechanism (b) =="
          tok stardelt-wrong-audience "$TW"
          post "wrong-aud" "$RUNNER_TEMP/w.json" -X POST "$KC" \
            --data-urlencode client_id=spike-ci-federated \
            --data-urlencode grant_type=client_credentials \
            --data-urlencode client_assertion_type="$JB" \
            --data-urlencode client_assertion@"$TW"

          echo "== refusal: expired assertion, mechanism (b) =="
          tok stardelt-deploy "$TE"
          echo "  sleeping 330 s so the assertion is past its 300 s exp"
          sleep 330
          post "expired" "$RUNNER_TEMP/e.json" -X POST "$KC" \
            --data-urlencode client_id=spike-ci-federated \
            --data-urlencode grant_type=client_credentials \
            --data-urlencode client_assertion_type="$JB" \
            --data-urlencode client_assertion@"$TE"

          echo "== this job's sub (for the pull_request row) =="
          python3 - "$T2" <<'PY'
          import sys, json, base64
          t = open(sys.argv[1]).read().strip()
          p = t.split(".")[1]
          c = json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))
          print("  sub=%s event_name=%s ref=%s" % (c.get("sub"), c.get("event_name"), c.get("ref")))
          PY
          rm -f "$T" "$T2" "$TW" "$TE" "$RUNNER_TEMP"/*.json.at
