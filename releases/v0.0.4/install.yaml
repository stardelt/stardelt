# stardelt v0.0.4 (commit 40bedc5e7e2b6e35fe819b76887b05e5ea0121d1). Install: kubectl apply --server-side --force-conflicts -f install.yaml

---
# The platform namespace's Pod Security floor (platform#1096 question 5).
#
# `restricted` is enforced: no privilege escalation, no added capabilities, seccomp
# `RuntimeDefault`, non-root. Every pod on both install paths passes it; the one that did
# not, Lakekeeper's chart `opa` sidecar, is patched by `scripts/lakekeeper-opa-security.sh`
# (#1095, #1361). The five SeaweedFS pods pass since platform#1758 (uid/gid 65534,
# `emptyDir` logs).
apiVersion: v1
kind: Namespace
# Applied by `make step-namespace`, which renders `name` from `$(NAMESPACE)`.
metadata:
  name: stardelt
  labels:
    app.kubernetes.io/part-of: stardelt
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest

---
