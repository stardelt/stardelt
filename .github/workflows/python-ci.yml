name: "python / CI"

on:
  push:
    branches: [main]
    tags: ["python/v*"]
    paths: ["python/**", ".github/workflows/python-ci.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/python-ci.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "An existing tag to publish ghcr.io/stardelt/stardelt-cli:v<release> for (e.g. python/v0.4.1)"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  test:
    name: Library (pytest, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install the library and its test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,jupyter]"

      - name: Run the tests
        run: python -m pytest tests -q

  image-cli-check:
    name: Build the CLI image (no push)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Build ghcr.io/stardelt/stardelt-cli:dev (not pushed)
        run: docker build --build-arg REVISION="${{ github.sha }}" -t ghcr.io/stardelt/stardelt-cli:dev -f image/Dockerfile .

      - name: The image runs the maintenance command
        run: |
          docker run --rm ghcr.io/stardelt/stardelt-cli:dev maintenance run --help
          docker run --rm ghcr.io/stardelt/stardelt-cli:dev maintenance run --help \
            | grep -q 'usage: stardelt maintenance run'

      - name: The image names the commit it was built from
        run: |
          got="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' ghcr.io/stardelt/stardelt-cli:dev)"
          if [ "$got" != "${{ github.sha }}" ]; then
            echo "revision label is '$got', expected '${{ github.sha }}'" >&2
            exit 1
          fi

  image-cli:
    name: Push the CLI image
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/python/v')))
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: The image tag and the commit this build publishes
        id: image
        # The input is user-supplied on a dispatch: it goes through env, never spliced
        # into the shell source.
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            tag="$RELEASE_TAG"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tag=dev
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag#python/}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push the CLI image
        uses: docker/build-push-action@v7
        with:
          context: python
          file: python/image/Dockerfile
          build-args: REVISION=${{ steps.image.outputs.sha }}
          push: true
          tags: ghcr.io/stardelt/stardelt-cli:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
