                  `15m` or `2h` (platform#131 step A). Absent: the warehouse is always on.
                nullable: true
                pattern: ^([1-9][0-9]*)(m|h)$
                type: string
              concurrency:
                description: Overrides of the class defaults. An absent field keeps the class value.
                nullable: true
                properties:
                  memoryShare:
                    description: Share of the engine's memory the class may use, for example `40%`.
                    nullable: true
                    pattern: ^([1-9][0-9]?|100)%$
                    type: string
                  queued:
                    description: Queries that may wait (the resource group's queue limit).
                    format: int32
                    maximum: 10000.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  running:
                    description: Queries that run at the same time (the resource group's hard concurrency limit).
                    format: int32
                    maximum: 100.0
                    minimum: 1.0
                    nullable: true
                    type: integer
                  scheduling:
                    description: How queued queries are chosen to run.
                    enum:
                    - fifo
                    - fair
                    - weighted
                    - weighted_fair
                    - null
                    nullable: true
                    type: string
                type: object
              default:
                default: false
                description: The class that queries land in when nothing selects another one.
                type: boolean
              displayName:
                maxLength: 100
                nullable: true
                type: string
              grants:
                default: []
                items:
                  description: A group that may send queries into a warehouse (the compute verb `use`).
                  properties:
                    group:
                      maxLength: 64
                      minLength: 1
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                      type: string
                  required:
                  - group
                  type: object
                maxItems: 50
                type: array
              lakehouseRef:
                description: The `Lakehouse` that hosts a catalog or a warehouse.
                properties:
                  name:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
