# The dbt demo: `shop_dbt` schemas in bronze, silver and gold, next to the `shop` schemas the
# notebook example writes. The schedule is the demo's nightly slot (04:00 Berlin); trigger it by
# hand with `kubectl -n stardelt exec deploy/airflow-scheduler -- airflow dags trigger
# stardelt__shop-dbt`.
# A transient catalog-authorization window can answer `Cannot access catalog silver` for a
# few seconds (#538 measured 3–15 s); two retries a minute apart cover it without a re-run.
#
# The dbt image ships the project at /opt/dbt/projects/shop, and the pod mints a fresh engine
# token from the ServicePrincipal `pipeline-demo` (group `demo`) on every invocation.
apiVersion: stardelt.io/v1alpha1
kind: Pipeline
metadata:
  name: shop-dbt
  namespace: stardelt
spec:
  ownerGroup: demo
  description: "Rebuilds the shop in dbt: seeds, loads and marts into the shop_dbt schemas of bronze, silver and gold."
  runAs: pipeline-demo
  retries:
    attempts: 2
    backoff: 1m
  viewers: [visitors]
  schedule:
    cron: "0 4 * * *"
    timezone: Europe/Berlin
  tasks:
    - name: build
      kind: dbt
      config:
        project: shop
        batches: '["tag:seed","tag:load","tag:marts"]'
        threads: "4"
