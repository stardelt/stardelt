name: "operator / CI"

on:
  push:
    branches: [main]
    paths: ["operator/**", ".github/workflows/operator-ci.yml", "platform/**"]
  pull_request:
    branches: [main]
    paths: ["operator/**", ".github/workflows/operator-ci.yml", "platform/**"]

permissions:
  contents: read

env:
  # The sibling component's files, read from this checkout instead of raw.githubusercontent.com.
  PLATFORM_MAKEFILE: ../platform/Makefile
  PLATFORM_JOB: ../platform/scripts/access-sync-job.py
  PLATFORM_NOVA_FILE: ../platform/manifests/nova-deployment.yaml

defaults:
  run:
    working-directory: operator

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test

      - name: Generated files are current
        run: cargo run --bin crdgen && git diff --exit-code chart/crds schemas

      - name: README lists every served CRD
        run: bash scripts/check-readme-crds.sh

      - name: CRDs stay compatible with the last release, or CHANGELOG.md names the change (#23)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_crd_compat.py

      - name: Chart pins agree with stardelt-platform
        run: bash scripts/check-platform-pins.sh

      - name: Access-sync job matches stardelt-platform
        run: bash scripts/check-access-sync-script.sh

      - name: Maintenance CLI image matches the published build
        run: bash scripts/check-cli-image.sh

      - name: Every platform install step has a parity row
        run: bash scripts/check-parity.sh
