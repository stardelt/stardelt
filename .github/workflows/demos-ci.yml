name: "demos / CI"

on:
  push:
    branches: [main]
    paths: ["demos/**", ".github/workflows/demos-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["demos/**", ".github/workflows/demos-ci.yml"]

defaults:
  run:
    working-directory: demos

jobs:
  lint:
    name: Lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install hadolint
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: hadolint airflow Dockerfile
        run: hadolint images/airflow/Dockerfile

      - name: hadolint dbt Dockerfile
        run: hadolint images/dbt/Dockerfile

  python-tests:
    name: Pipeline loader tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # `tests/test_notebook.py`'s operator tests build the pod with the Airflow Kubernetes
        # provider, exactly as the loader image does, so `airflow` must be installed here or they
        # skip in every environment (#1285). The Airflow pin is the image's `AIRFLOW_VERSION`
        # (`images/airflow/Dockerfile`) and the providers stay unpinned for the same reason: they
        # track the Airflow version, and one that needs another Airflow fails this job.
        # `pyarrow` is the image's pin and unskips `test_pegelonline.py`'s Arrow test.
        run: |
          python -m pip install pytest "httpx==0.28.1" "kubernetes>=35.0.0,!=36.0.0,<37.0.0" \
            "apache-airflow==3.2.2" "apache-airflow-providers-cncf-kubernetes" "pyarrow==26.0.0"

      - name: pytest
        run: python -m pytest -q tests

  bundle-validate:
    name: The shop bundle passes the released validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the released CLI
        run: python -m pip install "stardelt @ https://github.com/stardelt/stardelt/releases/download/v0.0.4/stardelt-0.0.4-py3-none-any.whl"

      - name: Validate the shop bundle
        run: python -m stardelt bundle validate examples/shop-bundle

  image-airflow:
    name: Build + push airflow demo image
    runs-on: ubuntu-latest
    # Only on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, python-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Short commit for the sha- tag
        id: short
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push ghcr.io/stardelt/airflow:demo and :sha-<commit>
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: demos
          file: demos/images/airflow/Dockerfile
          push: true
          sbom: true
          tags: |
            ghcr.io/stardelt/airflow:demo
            ghcr.io/stardelt/airflow:sha-${{ steps.short.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The push job above runs only on main, so without this a pull request would merge an
  # image that has never been built.
  image-airflow-check:
    name: Build airflow demo image (no push)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build ghcr.io/stardelt/airflow:demo (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: demos
          file: demos/images/airflow/Dockerfile
          push: false
          cache-from: type=gha

  image-dbt:
    name: Build + push dbt demo image
    runs-on: ubuntu-latest
    # Only on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, python-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push ghcr.io/stardelt/dbt:demo
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          # The dbt image's context is `demos`: the Dockerfile COPYs the tool image's own files
          # from `images/dbt/` and the sample project from `examples/shop`.
          context: demos
          file: demos/images/dbt/Dockerfile
          push: true
          sbom: true
          tags: ghcr.io/stardelt/dbt:demo
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull the pushed image
        run: docker pull ghcr.io/stardelt/dbt:demo

      - name: Smoke test the dbt image
        env: { IMAGE: ghcr.io/stardelt/dbt:demo }
        run: |
          docker run --rm --entrypoint /opt/dbt/bin/dbt "$IMAGE" --version
          docker run --rm --entrypoint python "$IMAGE" /opt/dbt/check-licenses.py /opt/dbt/licenses.json /opt/dbt/license-exceptions.txt
          docker run --rm -v "$PWD/examples/shop:/work" -w /work \
            --entrypoint /opt/dbt/bin/dbt "$IMAGE" parse --profiles-dir . --project-dir .
          docker run --rm --entrypoint /opt/dbt/bin/dbt "$IMAGE" parse --project-dir /opt/dbt/projects/shop --profiles-dir /opt/dbt/projects/shop

  # The push job above runs only on main, so without this a pull request would merge an
  # image that has never been built.
  image-dbt-check:
    name: Build dbt demo image (no push)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # `push: false` cannot be combined with `load: false`: the smoke test needs the image
      # in the local daemon, so this job loads it under a local tag instead of pushing it.
      - name: Build stardelt-dbt:test (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: demos
          file: demos/images/dbt/Dockerfile
          push: false
          load: true
          tags: stardelt-dbt:test
          cache-from: type=gha

      - name: Smoke test the dbt image
        env: { IMAGE: stardelt-dbt:test }
        run: |
          docker run --rm --entrypoint /opt/dbt/bin/dbt "$IMAGE" --version
          docker run --rm --entrypoint python "$IMAGE" /opt/dbt/check-licenses.py /opt/dbt/licenses.json /opt/dbt/license-exceptions.txt
          docker run --rm -v "$PWD/examples/shop:/work" -w /work \
            --entrypoint /opt/dbt/bin/dbt "$IMAGE" parse --profiles-dir . --project-dir .
          docker run --rm --entrypoint /opt/dbt/bin/dbt "$IMAGE" parse --project-dir /opt/dbt/projects/shop --profiles-dir /opt/dbt/projects/shop
