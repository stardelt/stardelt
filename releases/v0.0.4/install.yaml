apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platforminstances.stardelt.io
spec:
  group: stardelt.io
  names:
    kind: PlatformInstance
    plural: platforminstances
    shortNames:
    - platform
    singular: platforminstance
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Waiting
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A stardelt platform instance.
        properties:
          spec:
            description: 'Cluster-scoped root resource: declares which pillars and profile are installed.'
            properties:
              baseDomain:
                description: |-
                  Public DNS name the platform is served under, for example `data.example.com`: Nova answers
                  on the name itself and every other application on a subdomain (`id`, `trino`, `superset`...).
                maxLength: 253
                minLength: 3
                nullable: true
                pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
                type: string
              clusterOperation:
                default:
                  reconciliationPaused: false
                  stopped: false
                description: 'Freeze this resource: no cluster changes, status phase `Paused` (operator#64).'
                properties:
                  reconciliationPaused:
                    default: false
                    description: 'Stop reconciling: the operator writes `Paused` and applies nothing.'
                    type: boolean
                  stopped:
                    default: false
                    description: |-
                      Stop the workloads: scale every rendered Deployment and StatefulSet to zero, hibernate the
                      namespace's CNPG databases, and report `Stopped`. Data, PVCs and Secrets stay.
                    type: boolean
                type: object
              defaultTheme:
                default: graphite
                description: |-
                  Default theme for Nova's interface (the four ids of the theme library); a person's own
                  choice in Preferences wins. One of `dark`, `light`, `graphite` or `silver`.
                enum:
                - dark
                - light
                - graphite
                - silver
                type: string
              dryRun:
                default: true
                description: Plan only (no cluster changes) until explicitly disabled. Safe default.
                type: boolean
              identity:
                default:
                  adminGroup: stardelt-admins
                  mode: none
                  provider: oidc
                description: How users sign in; see [`IdentitySpec`].
                properties:
                  adminGroup:
                    default: stardelt-admins
                    description: Members of this group are platform administrators.
                    type: string
                  apiAudience:
                    description: '`external` only: the audience the engine and the catalog accept.'
                    maxLength: 256
                    minLength: 1
                    nullable: true
                    pattern: ^\S+$
                    type: string
                  clients:
                    additionalProperties:
                      description: One app registration made by the customer in their provider.
                      properties:
                        clientId:
                          maxLength: 256
                          minLength: 1
                          pattern: ^\S+$
                          type: string
                        clientSecretRef:
                          description: Required for every client except the public `lakekeeper` one. Never the value itself.
                          nullable: true
                          properties:
                            key:
                              default: client-secret
                              maxLength: 253
                              minLength: 1
                              type: string
                            name:
                              maxLength: 253
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - clientId
                      type: object
                    description: '`external` only: the app registrations the customer made, one entry per client.'
                    type: object
                  groupClaim:
                    description: |-
                      Name of the token claim that carries group (or role) names. Defaults to `roles` for
                      `entra` and `groups` otherwise.
                    nullable: true
                    type: string
