name: public-db-load
description: "Loads RNAcentral's public database into bronze.public_db every morning, with the Connection's password."
schedule: {cron: "0 5 * * *", timezone: Europe/Berlin}
viewers: [visitors]
tasks:
  - {name: schema, sqlFile: sql/schema.sql}
  - name: run
    notebook: {file: notebooks/load_rnacentral.ipynb, connection: rnacentral}
    dependsOn: [schema]
