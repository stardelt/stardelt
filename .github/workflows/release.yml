name: "release / Cut"

# Phase C of the release (stardelt/stardelt#2): prove a commit of main is releasable, generate
# releases/v<version>/ from its pins and open the release PR. Builds nothing.
# dry_run (the default) uploads the files as an artifact instead: the fresh-node run (#48)
# installs that install.yaml before the real cut.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "0.0.N (no v)"
        required: true
        type: string
      commit:
        description: "The commit of main to release (empty = main HEAD)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Only generate and upload the files"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  cut:
    name: Check the commit, generate the files, open the release PR
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PIN_TOKEN || github.token }}

      - name: The commit
        id: m
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^0\.0\.[0-9]+$ ]] || { echo "✗ version '$VERSION' is not 0.0.N"; exit 1; }
          sha="$(git rev-parse --verify "${COMMIT:-origin/main}^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main || { echo "✗ $sha is not on main"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "✗ tag v$VERSION exists"; exit 1
          fi
          git checkout --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Check the commit and generate releases/v${{ inputs.version }}/
        run: bash scripts/release/cut.sh "$VERSION" "${{ steps.m.outputs.sha }}"

      - name: Upload the files (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: release-v${{ inputs.version }}
          path: releases/v${{ inputs.version }}/

      - name: Open the release PR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.PIN_TOKEN || github.token }}
          SHA: ${{ steps.m.outputs.sha }}
        run: |
          set -euo pipefail
          mv "releases/v$VERSION" "$RUNNER_TEMP/out"
          git checkout -B "release/v$VERSION" origin/main
          mkdir -p releases && mv "$RUNNER_TEMP/out" "releases/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/v$VERSION"
          git commit -m "release: v$VERSION (commit ${SHA:0:12})"
          git push --force origin "release/v$VERSION"
          gh pr create --base main --head "release/v$VERSION" --title "release: v$VERSION" \
            --body "Generated by \`release / Cut\` from commit $SHA. Merging this PR publishes v$VERSION (release / Publish): it tags $SHA, tags every image in versions.yaml and creates the GitHub release. Review the digests and revisions in versions.yaml." \
            || echo "! could not open the PR; open it by hand from the branch release/v$VERSION"
