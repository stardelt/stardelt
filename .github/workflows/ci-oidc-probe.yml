name: ci oidc probe
on: push
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: token
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=stardelt-deploy" -o "$RUNNER_TEMP/token.json"
          jq -j .value "$RUNNER_TEMP/token.json" > "$RUNNER_TEMP/token"
      - name: claims
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/token" <<'PY'
          import base64, json, sys
          token = open(sys.argv[1]).read().strip()
          part = token.split(".")[1]
          part += "=" * (-len(part) % 4)
          claims = json.loads(base64.urlsafe_b64decode(part))
          keys = ("iss", "aud", "sub", "ref", "event_name", "repository",
                  "repository_owner_id", "repository_id", "job_workflow_ref")
          print(json.dumps({k: claims.get(k) for k in keys}, indent=1))
          PY
      - name: exchange-main
        run: |
          set -uo pipefail
          code=$(curl -sS -o "$RUNNER_TEMP/answer-main.json" -w '%{http_code}' \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=stardelt-deploy-ci-proof-main" \
            --data-urlencode "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
            --data-urlencode "client_assertion@$RUNNER_TEMP/token" \
            https://id.alpha.dev.stardelt.io/realms/stardelt/protocol/openid-connect/token)
          echo "main-status=$code"
          python3 - "$RUNNER_TEMP/answer-main.json" <<'PY'
          import json, sys
          body = json.load(open(sys.argv[1]))
          keys = ("error", "error_description", "access_token")
          print(json.dumps({k: ("<present>" if k == "access_token" and body.get(k) else body.get(k)) for k in keys}))
          PY
      - name: shape
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/token" <<'PY'
          import re, sys
          raw = open(sys.argv[1], "rb").read()
          token = raw.decode().strip()
          parts = token.split(".")
          print("bytes=%d parts=%d" % (len(raw), len(parts)))
          for i, part in enumerate(parts):
              bad = sorted({c for c in part if not re.match(r"[A-Za-z0-9_-]", c)})
              print("part%d len=%d len%%4=%d padding=%d unusual=%r" % (
                  i, len(part), len(part) % 4, part.count("="), bad))
          PY
      - name: exchange
        run: |
          set -uo pipefail
          code=$(curl -sS -o "$RUNNER_TEMP/answer.json" -w '%{http_code}' \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=stardelt-deploy-ci-proof" \
            --data-urlencode "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
            --data-urlencode "client_assertion@$RUNNER_TEMP/token" \
            https://id.alpha.dev.stardelt.io/realms/stardelt/protocol/openid-connect/token)
          echo "status=$code"
          python3 - "$RUNNER_TEMP/answer.json" <<'PY'
          import base64, json, sys
          body = json.load(open(sys.argv[1]))
          token = body.get("access_token")
          if not token:
              print(json.dumps(body)); raise SystemExit(0)
          part = token.split(".")[1]; part += "=" * (-len(part) % 4)
          claims = json.loads(base64.urlsafe_b64decode(part))
          keys = ("azp", "aud", "sub", "typ", "preferred_username", "groups")
          print(json.dumps({k: claims.get(k) for k in keys}, indent=1))
          PY
