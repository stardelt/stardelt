# Source: stardelt-operator/crds/stardelt.io_serviceprincipals.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceprincipals.stardelt.io
spec:
  group: stardelt.io
  names:
    kind: ServicePrincipal
    plural: serviceprincipals
    shortNames:
    - sp
    singular: serviceprincipal
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A non-human identity (client credentials) for pipelines, maintenance and collectors.
        properties:
          spec:
            description: |-
              A non-human identity for jobs, maintenance and collectors (decisions D20 and D21, internal note
              `design/scheduled-jobs.md`). With the platform identity provider the operator creates a client
              with a service account and the audiences below and writes its credentials to the Secret
              `sp-<name>`; with an external provider it only checks the Secret named in `existingSecretRef`.
              The owner group's members may name the principal as a pipeline's `runAs`; nobody may read the Secret.
            properties:
              audiences:
                default:
                - trino
                - lakekeeper
                description: |-
                  What the principal's tokens are valid for; at least one, both engines by default
                  (`trino` for SQL, `lakekeeper` for the `spark` session in a notebook).
                items:
                  description: What a principal's tokens are valid for (the `aud` claim of its access token).
                  enum:
                  - trino
                  - lakekeeper
                  - lakekeeper-trino
                  type: string
                maxItems: 2
                minItems: 1
                type: array
              existingSecretRef:
                description: 'Only with an external identity provider: the Secret that holds the app registration''s credentials.'
                nullable: true
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              ownerGroup:
                description: The group whose members may use the principal. Members never read its credentials.
                maxLength: 64
                minLength: 1
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                type: string
              purpose:
                default: pipeline
                description: |-
                  What a service principal is for — a pipeline, maintenance, a collector, or the platform's own
                  client. It decides nothing by itself (grants do); it makes the intent visible in `kubectl get`
                  and in Nova.
                enum:
                - pipeline
                - maintenance
                - collector
                - catalog
                type: string
            required:
            - ownerGroup
            type: object
            x-kubernetes-validations:
            - message: each audience may appear once
              rule: self.audiences.all(a, self.audiences.exists_one(b, b == a))
          status:
            nullable: true
            properties:
              clientId:
                nullable: true
                type: string
              conditions:
